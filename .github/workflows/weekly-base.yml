name: Weekly base image

on:
  schedule:
    # Every Sunday at 22:00 UTC (before the nightly builds)
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      git_branch:
        description: "tezos/tezos branch to build"
        required: false
        default: "master"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tezos-dev-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Tezos commit
        id: source
        env:
          TEZOS_BRANCH: ${{ inputs.git_branch || 'master' }}
        run: |
          commit=$(./scripts/resolve-tezos-commit.sh "$TEZOS_BRANCH")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Tezos $TEZOS_BRANCH: $commit"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.source.outputs.commit }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # The compile stage duplicates artifacts split across the final layers.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=min,image-manifest=true,oci-mediatypes=true

      - name: Delete old images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: tezos-dev-base
          exclude-tags: buildcache
          delete-untagged: true
          keep-n-tagged: 2
          token: ${{ secrets.GITHUB_TOKEN }}
